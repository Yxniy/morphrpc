name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '24 5 * * 2'

permissions: {}

jobs:
  pull-request:
    name: CodeQL PR report
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install the pinned Rust toolchain
        run: rustup show

      - name: Initialize Rust analysis
        uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          languages: rust
          build-mode: none

      - name: Generate a SARIF report with read-only permissions
        id: analyze
        uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          output: ${{ runner.temp }}/codeql-sarif
          upload: never
          upload-database: false

      - name: Upload the PR report as an Actions artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: codeql-pr-sarif
          path: ${{ steps.analyze.outputs.sarif-output }}/*.sarif
          if-no-files-found: error
          retention-days: 14

  analyze:
    name: CodeQL Rust
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install the pinned Rust toolchain
        run: rustup show

      - name: Initialize Rust analysis
        uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          languages: rust
          build-mode: none

      - name: Analyze and upload findings
        uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
