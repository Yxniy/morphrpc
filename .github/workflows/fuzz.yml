name: Fuzz

on:
  schedule:
    - cron: '43 4 * * 3'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frame-decode:
    name: Fuzz frame decoder
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      FUZZ_TOOLCHAIN: nightly-2026-11-01
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pinned nightly and cargo-fuzz
        working-directory: ${{ runner.temp }}
        env:
          CARGO_FUZZ_VERSION: 0.13.2
          CARGO_FUZZ_SHA256: b5b704018b63e0f151c17a057ac53b5111e1db545d1b9f72fee79f08a545931c
        run: |
          rustup toolchain install "$FUZZ_TOOLCHAIN" --profile minimal
          archive="$RUNNER_TEMP/cargo-fuzz.tar.gz"
          curl --fail --silent --show-error --location --retry 3 \
            "https://github.com/rust-fuzz/cargo-fuzz/releases/download/${CARGO_FUZZ_VERSION}/cargo-fuzz-${CARGO_FUZZ_VERSION}-x86_64-unknown-linux-musl.tar.gz" \
            --output "$archive"
          echo "$CARGO_FUZZ_SHA256  $archive" | sha256sum --check
          mkdir -p "$RUNNER_TEMP/fuzz-tools"
          tar -xzf "$archive" -C "$RUNNER_TEMP/fuzz-tools" cargo-fuzz
          echo "$RUNNER_TEMP/fuzz-tools" >> "$GITHUB_PATH"

      - name: Run a bounded AddressSanitizer fuzz session
        shell: bash
        run: |
          diagnostics="$RUNNER_TEMP/fuzz-diagnostics"
          mkdir -p "$diagnostics" "$RUNNER_TEMP/frame-corpus"
          cp tests/fixtures/v1/*.bin "$RUNNER_TEMP/frame-corpus/"
          cargo +"$FUZZ_TOOLCHAIN" fetch --locked --manifest-path fuzz/Cargo.toml
          CARGO_NET_OFFLINE=true timeout 14m cargo +"$FUZZ_TOOLCHAIN" fuzz run frame_decode \
            "$RUNNER_TEMP/frame-corpus" -- -max_total_time=300 -timeout=10 \
            -rss_limit_mb=2048 -max_len=1048580 -print_final_stats=1 \
            2>&1 | tee "$diagnostics/frame_decode.log"

      - name: Verify the fuzz lockfile
        if: always()
        run: git diff --exit-code -- fuzz/Cargo.lock

      - name: Upload logs and failing inputs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: frame-fuzz-diagnostics
          path: |
            ${{ runner.temp }}/fuzz-diagnostics
            fuzz/artifacts/frame_decode
          if-no-files-found: warn
          retention-days: 14
