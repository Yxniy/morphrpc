name: CI

on:
  push:
    branches: [main]
  pull_request:
  merge_group:
    types: [checks_requested]
  schedule:
    - cron: '37 5 * * 4'

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Rust
    if: github.event_name != 'schedule'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CARGO_TERM_COLOR: always
    steps:
      - name: Check out the revision under test
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install the pinned Rust toolchain
        run: rustup show

      - name: Cache registry downloads
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/cache
            ~/.cargo/registry/index
          key: cargo-registry-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Cargo.lock', 'compiler/Cargo.lock', 'compiler/tests/generated_project/Cargo.lock') }}

      - name: Check formatting
        run: |
          cargo fmt --all -- --check
          cargo fmt --manifest-path fuzz/Cargo.toml -- --check
          cargo fmt --manifest-path compiler/Cargo.toml -- --check
          cargo fmt --manifest-path compiler/tests/generated_project/Cargo.toml -- --check

      - name: Run Clippy
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings

      - name: Compile debug artifacts
        run: cargo build --workspace --all-targets --all-features --locked

      - name: Run unit and integration tests
        run: cargo test --workspace --all-features --locked

      - name: Check and test the contract compiler
        run: |
          cargo clippy --manifest-path compiler/Cargo.toml --all-targets --locked -- -D warnings
          cargo test --manifest-path compiler/Cargo.toml --locked

      - name: Build and test generated bindings
        run: |
          cargo build --manifest-path compiler/tests/generated_project/Cargo.toml --all-targets --locked
          cargo clippy --manifest-path compiler/tests/generated_project/Cargo.toml --all-targets --locked -- -D warnings
          cargo test --manifest-path compiler/tests/generated_project/Cargo.toml --locked

      - name: Verify the v1 wire format and golden fixtures
        run: cargo test --locked -p morphrpc --test codec --test protocol_version

      - name: Compile release artifacts
        run: cargo build --release --workspace --all-targets --all-features --locked

  audit:
    name: Dependency audit
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install cargo-audit
        uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with:
          tool: cargo-audit@0.22.2
          fallback: none

      - name: Check all lockfiles against RustSec
        working-directory: ${{ runner.temp }}
        run: |
          test -f "$GITHUB_WORKSPACE/Cargo.lock"
          test -f "$GITHUB_WORKSPACE/fuzz/Cargo.lock"
          test -f "$GITHUB_WORKSPACE/compiler/Cargo.lock"
          test -f "$GITHUB_WORKSPACE/compiler/tests/generated_project/Cargo.lock"
          status=0
          cargo-audit audit --file "$GITHUB_WORKSPACE/Cargo.lock" || status=1
          cargo-audit audit --file "$GITHUB_WORKSPACE/fuzz/Cargo.lock" || status=1
          cargo-audit audit --file "$GITHUB_WORKSPACE/compiler/Cargo.lock" || status=1
          cargo-audit audit --file "$GITHUB_WORKSPACE/compiler/tests/generated_project/Cargo.lock" || status=1
          exit "$status"

  workflow-lint:
    name: Workflow lint
    if: github.event_name != 'schedule'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Test the Performance Lab tooling
        run: python3 -m unittest discover -s benchmarks/lab

      - name: Validate workflows with actionlint and ShellCheck
        env:
          ACTIONLINT_VERSION: 1.7.12
          ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          archive="$RUNNER_TEMP/actionlint.tar.gz"
          curl --fail --silent --show-error --location --retry 3 \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz" \
            --output "$archive"
          echo "$ACTIONLINT_SHA256  $archive" | sha256sum --check
          tar -xzf "$archive" -C "$RUNNER_TEMP" actionlint
          shellcheck --version
          "$RUNNER_TEMP/actionlint" -color
          shellcheck .devcontainer/setup.sh

  migration:
    name: Migration assessment
    if: github.event_name != 'schedule'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out the revision under test
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Python
        uses: actions/setup-python@83679a892e2d95755f2dac6acb0bfd1e9ac5d548 # v6.1.0
        with:
          python-version: '3.11.11'

      - name: Test the static analyzer and reviewed contract handoff
        run: python -m unittest discover -s skills/fastapi-assessment/tests -v
