[package]
name = "morphrpc"
version = "0.1.0"
edition = "2024"
description = "Development-time tooling and a binary RPC runtime for machine-to-machine communication"
license = "Apache-2.0"
repository = "https://github.com/Yxniy/morphrpc"
readme = "README.md"

[dependencies]
tokio = { version = "1", features = ["io-util", "macros", "net", "rt-multi-thread", "sync", "time"] }

[workspace]
members = ["benchmarks"]
resolver = "3"
