[package]
name = "morphrpc-bench"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
morphrpc = { path = ".." }
tokio = { version = "1", features = ["full"] }
axum = "0.7"
reqwest = { version = "0.12", default-features = false, features = ["json"] }
tonic = "0.12"
prost = "0.13"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
csv = "1"

[build-dependencies]
tonic-build = "0.12"
protoc-bin-vendored = "3"
